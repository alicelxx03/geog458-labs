<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lab 3: Seattle Elevation and Waterways</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.15.0/dist/maplibre-gl.css">
  <style>
    body {
      margin: 0;
      font: 14px/1.5 Arial, sans-serif;
      color: #182e3a;
    }

    #map {
      position: absolute;
      inset: 0;
    }

    #panel {
      position: absolute;
      top: 12px;
      left: 12px;
      padding: 16px;
      width: 260px;
      max-width: calc(100% - 100px);
      background: white;
      max-height: calc(100% - 80px);
      overflow: auto;
      border-radius: 6px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 19px;
    }

    p {
      margin: 8px 0;
    }

    .ramp {
      height: 14px;
      background: linear-gradient(to right,
          #00804a, #00c878, #a5df75, #ffcf78, #ff7045, #e60026);
    }

    .values {
      display: flex;
      justify-content: space-between;
    }

    .maplibregl-popup-content {
      white-space: pre-line;
    }
  </style>
</head>

<body>
  <div id="map"></div>
  <section id="panel">
    <h1>Seattle Elevation and Waterways</h1>
    <p>Elevation: USGS 3DEP | Seattle Waterways</p>
    <p id="status">Step 1: map frame ready; add the basemap next.</p>
    <div id="surface-control" hidden>
      <label><input id="show-surface" type="checkbox" checked> Show elevation</label>
    </div>
    <div id="station-control" hidden>
      <label><input id="show-stations" type="checkbox" checked> Show waterways</label>
    </div>
    <div id="legend" hidden>
      <p><strong>Elevation (meters)</strong></p>
      <div class="ramp"></div>
      <div class="values">
        <span>-16</span>
        <span>666</span>
        <span>1348</span>
      </div>
      <p>Green represents lower elevations; red represents higher elevations.</p>
    </div>
  </section>

  <script type="module">
    import * as maplibregl from 'https://unpkg.com/maplibre-gl@6.15.0/dist/maplibre-gl.mjs';

    const map = new maplibregl.Map({
      container: 'map',
      style: {
        version: 8,
        sources: {},
        layers: [{
          id: 'background', type: 'background',
          paint: { 'background-color': '#edf1f0' }
        }]
      },
      center: [-122.3321, 47.6062],
      zoom: 10,
      minZoom: 8,
      maxZoom: 12,
      maxBounds: [[-122.75, 47.10], [-122.05, 48.15]]
    });
    map.addControl(new maplibregl.NavigationControl());
    map.addControl(new maplibregl.ScaleControl({ unit: 'metric' }));

    map.on('error', (event) => {
      document.getElementById('status').textContent =
        'Load error: check the file path and browser Console.';
      console.error(event.error);
    });

    map.on('load', () => {
      // Step 2: insert the basemap tile code here.
      map.addSource('basemap-tiles', {
        type: 'raster',
        tiles: ['assets/mapbox-independent/{z}/{x}/{y}.png'],
        tileSize: 256,
        scheme: 'xyz',
        minzoom: 8,
        maxzoom: 12,
        bounds: [-122.75, 47.10, -122.05, 48.15],
        attribution: '© Mapbox © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
      });
      map.addLayer({
        id: 'basemap',
        type: 'raster',
        source: 'basemap-tiles',
        paint: { 'raster-opacity': 1, 'raster-fade-duration': 0 }
      });

      document.getElementById('status').textContent =
        'Step 2: check your Studio basemap; pan and zoom.';

      // Add elevation raster tiles
      map.addSource('elevation-tiles', {
        type: 'raster',
        tiles: ['assets/elevation/{z}/{x}/{y}.png'],
        tileSize: 256,
        scheme: 'xyz',
        minzoom: 8,
        maxzoom: 12,
        attribution: 'Elevation data: USGS 3DEP'
      });

      // Display elevation raster
      map.addLayer({
        id: 'elevation-surface',
        type: 'raster',
        source: 'elevation-tiles',
        paint: {
          'raster-opacity': 0.7,
          'raster-fade-duration': 0
        }
      });

      // Show elevation control and legend
      document.getElementById('surface-control').hidden = false;
      document.getElementById('legend').hidden = false;

      // Toggle elevation visibility
      document.getElementById('show-surface').addEventListener('change', (event) => {
        map.setLayoutProperty(
          'elevation-surface',
          'visibility',
          event.target.checked ? 'visible' : 'none'
        );

        document.getElementById('legend').hidden = !event.target.checked;
      });

      // Add waterways GeoJSON
      map.addSource('waterways-data', {
        type: 'geojson',
        data: 'data/seattle_waterstreams.geojson'
      });

      // Display waterways as blue lines
      map.addLayer({
        id: 'waterways',
        type: 'line',
        source: 'waterways-data',
        paint: {
          'line-color': '#0066ff',
          'line-width': 3,
          'line-opacity': 0.9
        }
      });

      // Popup when a waterway is clicked
      map.on('click', 'waterways', (event) => {
        const feature = event.features[0];
        const properties = feature.properties;

        const details = Object.entries(properties)
          .filter(([key, value]) =>
            value !== null &&
            value !== '' &&
            typeof value !== 'object'
          )
          .slice(0, 6)
          .map(([key, value]) => `${key}: ${value}`)
          .join('\n');

        new maplibregl.Popup()
          .setLngLat(event.lngLat)
          .setText(details || 'Waterway feature')
          .addTo(map);
      });

      // Change cursor on hover
      map.on('mouseenter', 'waterways', () => {
        map.getCanvas().style.cursor = 'pointer';
      });

      map.on('mouseleave', 'waterways', () => {
        map.getCanvas().style.cursor = '';
      });

      // Show waterways checkbox
      document.getElementById('station-control').hidden = false;

      // Toggle waterways
      document.getElementById('show-stations').addEventListener('change', (event) => {
        map.setLayoutProperty(
          'waterways',
          'visibility',
          event.target.checked ? 'visible' : 'none'
        );
      });

      document.getElementById('status').textContent =
        'Click a waterway to view its attributes.';
    }); 
  </script>
</body>

</html>
